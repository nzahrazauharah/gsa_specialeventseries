<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GSA Challenge Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter untuk tampilan bersih ala Google Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Lucide Icons CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFFFF;
      color: #202124;
    }
    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    /* Sembunyikan scrollbar horizontal pada tab filter mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    header.sticky{top:env(safe-area-inset-top,0px) !important}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-[#DCEAFF] selection:text-[#174EA6]">

  <!-- BANNER INFORMASI PLATFORM TERBUKA -->
  <div class="bg-[#F4F8FF] border-b border-[#DCEAFF] px-4 py-2 text-xs text-[#174EA6]">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-[#4285F4]"></span>
        <span class="font-medium">
          Special Event Series • Persiapan UAS &amp; Proyek Akademik Bareng Google AI
        </span>
      </div>
    </div>
  </div>

  <!-- HEADER / NAVIGASI GLOBAL -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-[#E8EAED]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <!-- Logo -->
      <button type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" class="flex items-center gap-2.5 text-left focus:outline-none">
        <div class="w-9 h-9 rounded-xl bg-[#4285F4] flex items-center justify-center text-white shadow-xs">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="block text-base sm:text-lg font-bold tracking-tight text-[#202124] leading-none font-display">
            GSA Challenge Hub
          </span>
          <span class="block text-[11px] font-medium text-[#5F6368] mt-0.5">
            #TeamGoogle • Special Event Series
          </span>
        </div>
      </button>

      <div class="flex items-center gap-2">
        <button type="button" id="btn-vote" class="hidden px-4 py-2 rounded-full border border-[#DADCE0] bg-white hover:bg-[#F8FAFD] text-sm font-semibold text-[#202124] transition-colors">Tutup Voting</button>
        <button type="button" id="btn-submit" class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-[#4285F4] hover:bg-[#1967D2] disabled:opacity-50 text-white text-sm font-semibold transition-colors">
          <i data-lucide="plus-circle" class="w-4 h-4"></i><span>Kirim Karya</span>
        </button>
      </div>
    </div>
  </header>


  <main id="app-main" class="flex-1">
    <section class="bg-gradient-to-b from-[#F4F8FF] via-[#F8FBFF] to-white border-b border-[#E8EAED]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
        <div class="max-w-3xl mx-auto text-center">
          <div class="inline-flex items-center px-3.5 py-1.5 rounded-full bg-[#DCEAFF]/70 border border-[#AECBFA] text-[#174EA6] text-xs font-semibold mb-6">Google Student Ambassador</div>
          <h1 class="text-3xl sm:text-5xl lg:text-[54px] font-bold tracking-tight text-[#202124] leading-[1.15]">Special Event <span class="text-[#4285F4]">Series</span></h1>
          <p class="mt-5 text-base sm:text-lg text-[#5F6368] leading-relaxed">Persiapan UAS &amp; Proyek Akademik Bareng Google AI</p>
        </div>
      </div>
    </section>
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-14"><div id="modules" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div></section>
    <section class="bg-[#F8FAFD] border-t border-[#E8EAED] py-12 sm:py-14 min-h-[50vh]"><div id="gallery" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"></div></section>
  </main>
  <footer class="bg-[#F8FAFD] border-t border-[#E8EAED] py-8 px-4 text-center text-xs text-[#5F6368] font-medium">Special Event Series: Persiapan UAS &amp; Proyek Akademik Bareng Google AI • 2026</footer>

<!-- MODAL DETAIL PROYEK -->
  <div id="project-modal" onclick="closeProjectModal()" class="hidden fixed inset-0 z-50 bg-[#202124]/50 backdrop-blur-[2px] flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div onclick="event.stopPropagation()" class="bg-white border border-[#E8EAED] rounded-2xl w-full max-w-4xl max-h-[92vh] overflow-hidden flex flex-col shadow-xl">
      <div class="px-5 py-4 border-b border-[#E8EAED] flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modal-event-badge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-[#E8F0FE] text-[#174EA6] shrink-0"></span>
          <span class="text-sm font-semibold text-[#5F6368] truncate">Detail Karya Peserta</span>
        </div>
        <button type="button" onclick="closeProjectModal()" aria-label="Tutup" class="p-2 rounded-full hover:bg-[#F1F3F4] text-[#5F6368] hover:text-[#202124]">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="project-modal-body" class="overflow-y-auto p-5 sm:p-6 space-y-6"></div>
    </div>
  </div>

  
  <div id="submit-modal" onclick="closeSubmit()" class="hidden fixed inset-0 z-50 bg-[#202124]/50 backdrop-blur-[2px] flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <form id="sub-form" onclick="event.stopPropagation()" class="bg-white border border-[#E8EAED] rounded-2xl w-full max-w-lg p-5 sm:p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between"><h2 class="text-lg font-bold text-[#202124]">Kirim Karya</h2>
        <button type="button" onclick="closeSubmit()" aria-label="Tutup" class="p-2 rounded-full hover:bg-[#F1F3F4] text-[#5F6368]"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div><label class="block text-xs font-semibold text-[#202124] mb-1.5">Kategori</label><div id="sub-events" class="grid grid-cols-2 gap-2"></div></div>
      <div><label class="block text-xs font-semibold text-[#202124] mb-1.5">Nama pembuat</label><input id="sub-name" maxlength="60" class="w-full px-3.5 py-2.5 rounded-xl border border-[#DADCE0] text-sm focus:outline-none focus:border-[#4285F4]"></div>
      <div><label class="block text-xs font-semibold text-[#202124] mb-1.5">Nama karya</label><input id="sub-title" maxlength="80" class="w-full px-3.5 py-2.5 rounded-xl border border-[#DADCE0] text-sm focus:outline-none focus:border-[#4285F4]"></div>
      <div><label class="block text-xs font-semibold text-[#202124] mb-1.5">Screenshot hasil karya</label>
        <label class="block border-2 border-dashed border-[#AECBFA] bg-[#F4F8FF]/60 hover:bg-[#F4F8FF] rounded-2xl p-5 text-center cursor-pointer">
          <i data-lucide="upload" class="w-5 h-5 mx-auto text-[#174EA6]"></i>
          <span id="sub-file-name" class="block mt-2 text-sm font-semibold text-[#174EA6]">Pilih gambar (JPG, PNG, WebP)</span>
          <input id="sub-file" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"></label></div>
      <div><label class="block text-xs font-semibold text-[#202124] mb-1.5">Link Gemini / Gemini Notebook</label><input id="sub-link" placeholder="https://" class="w-full px-3.5 py-2.5 rounded-xl border border-[#DADCE0] text-sm focus:outline-none focus:border-[#4285F4]"></div>
      <p id="sub-err" class="text-xs text-[#D93025] min-h-[16px]"></p>
      <button type="submit" id="sub-send" class="w-full py-2.5 px-4 rounded-full bg-[#4285F4] hover:bg-[#1967D2] disabled:opacity-50 text-white text-sm font-semibold transition-colors">Kirim Karya</button>
    </form>
  </div>

<!-- TOAST NOTIFIKASI -->
  <div id="toast-box" class="hidden fixed bottom-20 md:bottom-6 right-4 z-50 bg-[#202124] text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2.5 max-w-sm">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-[#8AB4F8] shrink-0"></i>
    <span id="toast-text"></span>
  </div>

  <script>
    // ISI DENGAN KONFIGURASI FIREBASE REALTIME DATABASE (lihat panduan). Kosong = mode lokal untuk pratinjau.
    const FIREBASE_CONFIG = { databaseURL: 'https://gsa-special-event-series-default-rtdb.asia-southeast1.firebasedatabase.app', projectId: 'gsa-special-event-series' };
    // PIN admin: buka halaman dengan tambahan #admin di akhir alamat untuk tutup voting dan hapus karya.
    const ADMIN_PIN = 'ganti-pin';
    const EVENTS_CONFIG = [
      {
        id: 'NOTELAB',
        number: '01',
        session: 'Sesi 1: Akademik & Riset',
        name: 'NOTELAB',
        shortDesc: 'Bikin Study Kit UAS cerdas dan terstruktur menggunakan Gemini Notebook.',
        fullDesc: 'Tantangan Sesi 1: Susun Study Kit Persiapan UAS yang rapi, ringkas, dan interaktif dari materi kuliah menggunakan Gemini Notebook.',
        accentBg: '#EEF4FF',
        accentBorder: '#D2E3FC',
        accentText: '#174EA6',
        icon: 'book-open'
      },
      {
        id: 'DEEPQUEST',
        number: '02',
        session: 'Sesi 1: Akademik & Riset',
        name: 'DEEPQUEST',
        shortDesc: 'Cari referensi dan bukti riset valid menggunakan Gemini Deep Research.',
        fullDesc: 'Tantangan Sesi 1: Eksplorasi topik akademik, kumpulkan referensi kredibel, dan susun bukti riset valid dengan bantuan Gemini Deep Research.',
        accentBg: '#F0F6FF',
        accentBorder: '#C6DAF9',
        accentText: '#1967D2',
        icon: 'compass'
      },
      {
        id: 'GEMPLAY',
        number: '03',
        session: 'Sesi 2: Gemplay & GSA Connect',
        name: 'GEMPLAY',
        shortDesc: 'Bikin proyek media kreatif dan interaktif menggunakan Gemini Canvas.',
        fullDesc: 'Tantangan Sesi 2: Kembangkan proyek media, dokumen interaktif, atau visualisasi kreatif untuk tugas kuliah menggunakan Gemini Canvas.',
        accentBg: '#F4F8FF',
        accentBorder: '#DCEAFF',
        accentText: '#185ABC',
        icon: 'gamepad-2'
      },
      {
        id: 'GSA CONNECT',
        number: '04',
        session: 'Sesi 2: Gemplay & GSA Connect',
        name: 'GSA CONNECT',
        shortDesc: 'Susun profil karier dan temukan peluang pengembangan diri bareng Gemini.',
        fullDesc: 'Tantangan Sesi 2: Rancang profil karier profesional, peta pengembangan diri, dan rencana peluang akademik/karier bersama Gemini.',
        accentBg: '#EDF3FC',
        accentBorder: '#D2E3FC',
        accentText: '#174EA6',
        icon: 'users'
      }
    ];

const $ = s => document.querySelector(s);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} } };
    const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
    const evOf = id => EVENTS_CONFIG.find(e => e.id === id) || EVENTS_CONFIG[0];
    const icons = () => { if (window.lucide) lucide.createIcons(); };

    // Identitas anonim per browser (tanpa login), dipakai untuk mencegah like/komentar ke karya sendiri
    let uid = store.get('gsa-uid');
    if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); store.set('gsa-uid', uid); }

    function localBackend() {
      const d = {}, ls = {}, emit = p => (ls[p] || []).forEach(f => f(d[p] || {}));
      return { local: true,
        watch(p, f) { (ls[p] = ls[p] || []).push(f); f(d[p] || {}); },
        put(p, k, v) { (d[p] = d[p] || {})[k] = v; emit(p); },
        del(p, k) { if (d[p]) delete d[p][k]; emit(p); } };
    }
    function fbBackend() {
      firebase.initializeApp(FIREBASE_CONFIG);
      const r = firebase.database();
      return { local: false,
        watch(p, f) { r.ref(p).on('value', s => f(s.val() || {}), () => f({})); },
        put: (p, k, v) => r.ref(p + '/' + k).set(v),
        del: (p, k) => r.ref(p + '/' + k).remove() };
    }
    let bk;
    try { bk = FIREBASE_CONFIG.databaseURL && window.firebase ? fbBackend() : localBackend(); } catch (e) { bk = localBackend(); }

    let owner = false, closed = false, loaded = false, works = [], likes = [], comments = [];
    let filter = 'ALL', sort = 'new', openId = null, armed = '', selEvent = 'NOTELAB', toastTimer = null;
    if (location.hash === '#admin') { const pin = prompt('PIN admin'); owner = !!pin && pin === ADMIN_PIN; }

    function showToast(msg) {
      $('#toast-text').textContent = msg; $('#toast-box').classList.remove('hidden'); icons();
      clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast-box').classList.add('hidden'), 3200);
    }
    // Skor = like dari orang lain + jumlah komentator berbeda (pembuat karya tidak dihitung)
    const stats = w => {
      const lk = likes.filter(l => l.workId === w.id && l.uid !== w.uid).length;
      const cm = comments.filter(c => c.workId === w.id);
      const people = new Set(cm.filter(c => c.uid !== w.uid).map(c => c.uid)).size;
      return { lk, cm, people, score: lk + people };
    };
    const cmp = (a, b) => b.s.score - a.s.score || b.s.lk - a.s.lk || a.w.createdAt - b.w.createdAt;
    const fmt = t => new Date(t).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const pill = on => `px-3.5 py-1.5 rounded-full text-xs font-bold border transition-colors ${on ? 'bg-[#4285F4] border-[#4285F4] text-white' : 'bg-white border-[#DADCE0] text-[#5F6368] hover:text-[#202124]'}`;
    const rows = o => Object.entries(o).map(([id, v]) => ({ id, ...v }));

    function renderModules() {
      $('#modules').innerHTML = EVENTS_CONFIG.map(ev => {
        const count = works.filter(w => w.event === ev.id).length;
        return `<div class="bg-white border border-[#E8EAED] hover:border-[#AECBFA] rounded-2xl p-6 flex flex-col justify-between transition-all duration-200 hover:shadow-[0_6px_20px_rgba(23,78,166,0.06)]">
          <div>
            <div class="flex items-center justify-between mb-5">
              <span class="text-xs font-bold px-2.5 py-1 rounded-lg border" style="background-color:${ev.accentBg};border-color:${ev.accentBorder};color:${ev.accentText};">EVENT ${ev.number}</span>
              <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background-color:${ev.accentBg};color:${ev.accentText};"><i data-lucide="${ev.icon}" class="w-5 h-5"></i></div>
            </div>
            <h3 class="text-xl font-bold text-[#202124] tracking-tight">${ev.name}</h3>
            <p class="mt-1 text-xs font-semibold text-[#4285F4]">${ev.session}</p>
            <p class="mt-2.5 text-sm text-[#5F6368] leading-relaxed">${ev.shortDesc}</p>
          </div>
          <div class="mt-6 pt-4 border-t border-[#F1F3F4]">
            <div class="flex items-center justify-between text-xs text-[#5F6368] mb-3"><span>Karya terkumpul</span><span class="font-semibold text-[#202124]">${count}</span></div>
            <button type="button" data-filter="${esc(ev.id)}" class="w-full py-2.5 px-4 rounded-xl bg-[#F4F8FF] hover:bg-[#DCEAFF] text-[#174EA6] font-semibold text-sm transition-colors">Lihat Karya</button>
          </div></div>`;
      }).join('');
    }

    function card({ w, s }) {
      const ev = evOf(w.event), mine = likes.some(l => l.workId === w.id && l.uid === uid), own = w.uid === uid, link = safeUrl(w.link);
      return `<article data-open="${w.id}" class="group bg-white border border-[#E8EAED] hover:border-[#AECBFA] rounded-2xl overflow-hidden transition-all duration-200 hover:shadow-[0_6px_20px_rgba(23,78,166,0.08)] flex flex-col cursor-pointer">
        <div class="relative aspect-video w-full bg-[#F4F8FF] overflow-hidden border-b border-[#E8EAED]">
          <img src="${esc(w.shot)}" alt="${esc(w.title)}" class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-300" />
          <div class="absolute top-3 left-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold border" style="background-color:${ev.accentBg};border-color:${ev.accentBorder};color:${ev.accentText};">${esc(w.event)}</span></div>
        </div>
        <div class="p-5 flex-1 flex flex-col justify-between">
          <div>
            <div class="flex items-start justify-between gap-2">
              <h3 class="text-[17px] font-semibold text-[#202124] leading-snug line-clamp-2 group-hover:text-[#174EA6] transition-colors">${esc(w.title)}</h3>
              <span class="text-xs font-bold text-[#174EA6] shrink-0 mt-1">${s.score} poin</span>
            </div>
            <p class="mt-1.5 text-sm text-[#5F6368] flex items-center gap-1.5">
              <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#E8F0FE] text-[#174EA6] text-xs font-semibold">${esc(w.name.charAt(0).toUpperCase())}</span>
              <span class="truncate">${esc(w.name)}</span></p>
          </div>
          ${link ? `<div class="mt-4 pt-3 border-t border-[#F1F3F4]"><a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-medium text-[#1967D2] hover:text-[#174EA6] hover:underline"><i data-lucide="external-link" class="w-3.5 h-3.5"></i><span>Buka Tautan Gemini / Gemini Notebook</span></a></div>` : ''}
          <div class="mt-4 pt-3 border-t border-[#F1F3F4] flex items-center justify-between">
            <div class="flex items-center gap-2">
              <button type="button" data-like="${w.id}" ${own || closed ? 'disabled' : ''} class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium border transition-colors disabled:opacity-60 ${mine ? 'bg-[#E8F0FE] border-[#AECBFA] text-[#174EA6]' : 'bg-white border-[#DADCE0] text-[#5F6368] hover:bg-[#F8FAFD] hover:text-[#202124]'}">
                <i data-lucide="heart" class="w-4 h-4 ${mine ? 'fill-[#4285F4] text-[#4285F4]' : ''}"></i><span>${s.lk}</span></button>
              <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium bg-white border border-[#DADCE0] text-[#5F6368]"><i data-lucide="message-square" class="w-4 h-4"></i><span>${s.cm.length}</span></span>
              ${owner ? `<button type="button" data-delw="${w.id}" class="px-3 py-1.5 rounded-full text-xs font-semibold border border-[#F28B82] text-[#D93025] bg-white hover:bg-[#FCE8E6]">${armed === 'w' + w.id ? 'Yakin hapus?' : 'Hapus'}</button>` : ''}
            </div>
            <span class="text-xs font-medium text-[#4285F4] inline-flex items-center gap-0.5">Detail <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
          </div>
        </div>
      </article>`;
    }

    function renderGallery() {
      const g = $('#gallery');
      if (!loaded) { g.innerHTML = '<p class="text-center text-sm text-[#5F6368] py-10">Memuat karya...</p>'; return; }
      const winners = EVENTS_CONFIG.map(ev => {
        const t = works.filter(w => w.event === ev.id).map(w => ({ w, s: stats(w) })).sort(cmp)[0];
        const has = t && t.s.score > 0;
        return `<div ${has ? `data-open="${t.w.id}"` : ''} class="bg-white border border-[#E8EAED] rounded-2xl p-4 ${has ? 'cursor-pointer hover:border-[#AECBFA]' : ''} ${closed ? 'border-2' : ''}" style="border-top:4px solid ${ev.accentText}">
          <p class="text-xs font-bold text-[#5F6368]">${ev.name}</p>
          <p class="mt-1 text-base font-bold text-[#202124] truncate">${has ? esc(t.w.title) : '-'}</p>
          <p class="text-xs text-[#5F6368] truncate">${has ? `${esc(t.w.name)} • ${t.s.score} poin` : 'Belum ada suara'}</p></div>`;
      }).join('');
      const list = works.filter(w => filter === 'ALL' || w.event === filter).map(w => ({ w, s: stats(w) }));
      if (sort === 'top') list.sort(cmp);
      g.innerHTML = `
        ${bk.local ? '<div class="mb-6 px-4 py-3 rounded-xl bg-[#FEF7E0] border border-[#FDE293] text-sm text-[#7A5B00] text-center">Mode lokal: data belum tersinkron antar perangkat. Isi FIREBASE_CONFIG di file ini.</div>' : ''}
        ${closed ? '<div class="mb-6 px-4 py-3 rounded-xl bg-[#E8F0FE] border border-[#AECBFA] text-sm font-semibold text-[#174EA6] text-center">Voting ditutup</div>' : ''}
        <span class="text-xs font-bold uppercase tracking-wider text-[#4285F4]">${closed ? 'Pemenang' : 'Pemimpin Sementara'}</span>
        <div class="mt-3 mb-10 grid grid-cols-2 lg:grid-cols-4 gap-4">${winners}</div>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <h2 class="text-2xl sm:text-3xl font-bold text-[#202124]">Karya Peserta</h2>
          <button type="button" data-sort="1" class="${pill(false)} self-start">Urut: ${sort === 'top' ? 'Suara terbanyak' : 'Terbaru'}</button>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-6">${['ALL', ...EVENTS_CONFIG.map(e => e.id)].map(id => `<button type="button" data-filter="${esc(id)}" class="${pill(filter === id)} whitespace-nowrap">${id === 'ALL' ? 'Semua' : id}</button>`).join('')}</div>
        ${list.length ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${list.map(card).join('')}</div>` : '<div class="bg-white border border-[#E8EAED] rounded-2xl p-10 text-center text-sm text-[#5F6368]">Belum ada karya di kategori ini.</div>'}`;
    }

    function renderModal() {
      const w = works.find(x => x.id === openId);
      if (!w) { if (openId) closeProjectModal(); return; }
      const s = stats(w), mine = likes.some(l => l.workId === w.id && l.uid === uid), own = w.uid === uid, link = safeUrl(w.link);
      const dn = $('#m-name') ? $('#m-name').value : '', dt = $('#m-text') ? $('#m-text').value : '';
      const foc = document.activeElement && document.activeElement.id;
      $('#modal-event-badge').textContent = w.event;
      const cms = s.cm.length === 0
        ? '<div class="p-4 rounded-xl bg-[#F8FAFD] border border-[#E8EAED] text-sm text-[#5F6368] text-center">Belum ada komentar.</div>'
        : s.cm.map(c => `<div class="p-3.5 rounded-2xl bg-[#F8FAFD] border border-[#E8EAED] flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-[#DCEAFF] text-[#174EA6] font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">${esc(c.name.charAt(0).toUpperCase())}</div>
            <div class="min-w-0"><div class="flex items-center gap-2"><span class="text-sm font-semibold text-[#202124]">${esc(c.name)}</span><span class="text-xs text-[#80868B]">• ${fmt(c.createdAt)}</span>
            ${owner ? `<button type="button" data-delc="${c.id}" class="text-xs font-semibold text-[#D93025]">${armed === 'c' + c.id ? 'Yakin?' : 'Hapus'}</button>` : ''}</div>
            <p class="mt-1 text-sm text-[#3C4043] leading-relaxed break-words">${esc(c.text)}</p></div></div>`).join('');
      const form = closed || own ? '' : `<form id="m-form" class="space-y-2.5">
            <input id="m-name" maxlength="60" placeholder="Nama" class="w-full px-4 py-3 rounded-full border border-[#DADCE0] text-sm focus:outline-none focus:border-[#4285F4]" />
            <div class="flex items-center gap-2.5"><input id="m-text" maxlength="400" placeholder="Tulis komentar" class="flex-1 px-4 py-3 rounded-full border border-[#DADCE0] text-sm focus:outline-none focus:border-[#4285F4]" />
            <button type="submit" class="inline-flex items-center gap-1.5 px-5 py-3 rounded-full bg-[#4285F4] hover:bg-[#1967D2] text-white text-sm font-semibold shrink-0"><i data-lucide="send" class="w-4 h-4"></i><span>Kirim</span></button></div></form>`;
      $('#project-modal-body').innerHTML = `
        <div class="rounded-xl overflow-hidden border border-[#E8EAED] bg-[#F4F8FF]"><img src="${esc(w.shot)}" alt="${esc(w.title)}" class="w-full max-h-[420px] object-contain mx-auto" /></div>
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 pb-5 border-b border-[#E8EAED]">
          <div><h2 class="text-xl sm:text-2xl font-bold text-[#202124]">${esc(w.title)}</h2><p class="mt-1.5 text-sm text-[#5F6368]">Oleh <span class="font-semibold text-[#202124]">${esc(w.name)}</span> • ${s.score} poin</p></div>
          <div class="flex flex-wrap items-center gap-2.5 shrink-0">
            <button type="button" data-like="${w.id}" ${own || closed ? 'disabled' : ''} class="inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-semibold border transition-colors disabled:opacity-60 ${mine ? 'bg-[#E8F0FE] border-[#AECBFA] text-[#174EA6]' : 'bg-white border-[#DADCE0] text-[#202124] hover:bg-[#F8FAFD]'}">
              <i data-lucide="heart" class="w-4 h-4 ${mine ? 'fill-[#4285F4] text-[#4285F4]' : ''}"></i><span>${s.lk} Suka</span></button>
            ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#4285F4] hover:bg-[#1967D2] text-white text-sm font-semibold transition-colors"><span>Buka Gemini / Gemini Notebook</span><i data-lucide="external-link" class="w-4 h-4"></i></a>` : ''}
          </div></div>
        <div><h3 class="text-base font-bold text-[#202124] mb-4">Komentar (${s.cm.length})</h3>
          <div class="space-y-3 mb-5">${cms}</div>${form}</div>`;
      if ($('#m-name')) { $('#m-name').value = dn || store.get('gsa-name'); $('#m-text').value = dt; if (foc === 'm-name' || foc === 'm-text') $('#' + foc).focus(); }
      icons();
    }

    function render() {
      $('#btn-vote').classList.toggle('hidden', !owner);
      $('#btn-vote').textContent = closed ? 'Buka Voting' : 'Tutup Voting';
      $('#btn-submit').disabled = closed;
      renderModules(); renderGallery(); if (openId) renderModal(); icons();
    }

    function openProjectModal(id) { openId = id; $('#project-modal').classList.remove('hidden'); renderModal(); }
    function closeProjectModal() { openId = null; $('#project-modal').classList.add('hidden'); }
    function closeSubmit() { $('#submit-modal').classList.add('hidden'); }
    function renderSubEvents() {
      $('#sub-events').innerHTML = EVENTS_CONFIG.map(ev => `<button type="button" data-ev="${esc(ev.id)}" class="py-2.5 px-3 rounded-xl text-xs font-bold border text-center transition-colors ${selEvent === ev.id ? 'bg-[#E8F0FE] border-[#4285F4] text-[#174EA6]' : 'bg-white border-[#DADCE0] text-[#5F6368] hover:bg-[#F8FAFD]'}">${ev.name}</button>`).join('');
    }
    // Perkecil screenshot agar ringan disimpan dan dimuat bersama
    function toDataUrl(file) {
      return new Promise((res, rej) => {
        const img = new Image(), u = URL.createObjectURL(file);
        img.onload = () => {
          const r = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = rej; img.src = u;
      });
    }
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

    document.addEventListener('click', async e => {
      if (e.target.closest('a')) return;
      const t = e.target.closest('[data-filter],[data-sort],[data-like],[data-open],[data-delw],[data-delc],[data-ev]');
      if (!t) return;
      const d = t.dataset;
      if (d.ev) { selEvent = d.ev; renderSubEvents(); return; }
      if (d.sort) { sort = sort === 'top' ? 'new' : 'top'; renderGallery(); icons(); return; }
      if (d.filter) { filter = d.filter; renderGallery(); icons(); $('#gallery').scrollIntoView({ behavior: 'smooth' }); return; }
      try {
        if (d.like) {
          const w = works.find(x => x.id === d.like);
          if (closed || !w || w.uid === uid) return;
          const key = d.like + '_' + uid;
          likes.some(l => l.id === key) ? await bk.del('likes', key) : await bk.put('likes', key, { workId: d.like, uid });
        } else if (owner && (d.delw || d.delc)) {
          const key = d.delw ? 'w' + d.delw : 'c' + d.delc;
          if (armed !== key) { armed = key; render(); return; }
          armed = '';
          await bk.del(d.delw ? 'works' : 'comments', d.delw || d.delc);
        } else if (d.open) openProjectModal(d.open);
      } catch (err) {}
    });

    document.addEventListener('submit', async e => {
      if (e.target.id !== 'm-form') return;
      e.preventDefault();
      const w = works.find(x => x.id === openId);
      const name = $('#m-name').value.trim(), text = $('#m-text').value.trim();
      if (closed || !w || w.uid === uid || !name || !text) return;
      store.set('gsa-name', name); $('#m-text').value = '';
      try { await bk.put('comments', newId(), { workId: openId, name, text, uid, createdAt: Date.now() }); } catch (err) { showToast('Komentar belum terkirim.'); }
    });

    $('#btn-submit').onclick = () => {
      $('#sub-name').value = store.get('gsa-name'); $('#sub-err').textContent = '';
      if (filter !== 'ALL') selEvent = filter;
      renderSubEvents(); $('#submit-modal').classList.remove('hidden'); icons();
    };
    $('#sub-file').onchange = e => { const f = e.target.files[0]; $('#sub-file-name').textContent = f ? f.name : 'Pilih gambar (JPG, PNG, WebP)'; };
    $('#btn-vote').onclick = () => bk.put('config', 'closed', !closed);

    $('#sub-form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#sub-err'), btn = $('#sub-send');
      const name = $('#sub-name').value.trim(), title = $('#sub-title').value.trim(), file = $('#sub-file').files[0], link = safeUrl($('#sub-link').value.trim());
      if (closed) return err.textContent = 'Voting sudah ditutup.';
      if (!name) return err.textContent = 'Nama pembuat wajib diisi.';
      if (!title) return err.textContent = 'Nama karya wajib diisi.';
      if (!file) return err.textContent = 'Screenshot hasil karya wajib diunggah.';
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return err.textContent = 'Format gambar harus PNG, JPG, atau WebP.';
      if (!link) return err.textContent = 'Link harus diawali https://';
      btn.disabled = true; err.textContent = 'Mengirim...';
      try {
        const shot = await toDataUrl(file);
        await bk.put('works', newId(), { event: selEvent, name, title, link, shot, uid, createdAt: Date.now() });
        store.set('gsa-name', name);
        $('#sub-form').reset(); $('#sub-file-name').textContent = 'Pilih gambar (JPG, PNG, WebP)';
        err.textContent = ''; closeSubmit(); showToast('Karya berhasil dikirim.');
      } catch (x) { err.textContent = 'Karya belum terkirim. Periksa koneksi lalu coba lagi.'; }
      btn.disabled = false;
    });

    bk.watch('works', o => { works = rows(o).sort((a, b) => b.createdAt - a.createdAt); loaded = true; render(); });
    bk.watch('likes', o => { likes = rows(o); render(); });
    bk.watch('comments', o => { comments = rows(o).sort((a, b) => a.createdAt - b.createdAt); render(); });
    bk.watch('config', o => { closed = !!o.closed; render(); });
    render();
  </script>
</body>
</html>
